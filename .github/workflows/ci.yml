name: CI

on:
  pull_request:
    branches: [frontend, main]
  push:
    branches: [frontend, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hackvillage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hackvillage
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hackvillage_shadow
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Create the shadow database
        run: psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE hackvillage_shadow"

      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy --schema backend/prisma/schema.prisma

      - name: Check the migrations match schema.prisma
        run: >-
          npx prisma migrate diff
          --from-migrations backend/prisma/migrations
          --to-schema-datamodel backend/prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      - name: Seed the database
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test